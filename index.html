<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111413">
  <title>The Spectator Loop</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #111413;
      --foreground: #eeeee8;
      --muted: #a5ada6;
      --accent: #c8ee72;
      --rule: #343b36;
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: var(--background);
      color: var(--foreground);
    }

    main {
      width: min(100%, 680px);
      padding: 42px 0 50px;
    }

    .eyebrow, .instructions, .track-label {
      font-family: "Helvetica Neue", Helvetica, sans-serif;
      letter-spacing: 0;
    }

    .eyebrow {
      margin: 0 0 30px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      max-width: 640px;
      margin: 0;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 400;
      line-height: 0.98;
    }

    .instructions {
      max-width: 480px;
      margin: 26px 0 54px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .player {
      padding-top: 19px;
      border-top: 1px solid var(--rule);
    }

    .track-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    audio {
      display: block;
      width: 100%;
      margin-top: 16px;
      accent-color: var(--accent);
    }

    audio:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    @media (max-width: 520px) {
      body { padding-inline: 20px; }
      main { padding: 28px 0 36px; }
      .instructions { margin: 22px 0 40px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">An audio story test</p>
    <h1>The Spectator Loop</h1>
    <p class="instructions">Put on headphones and find a quiet place. Listen all the way through, giving the sound your full attention.</p>
    <section class="player" aria-label="Audio story">
      <p class="track-label">Listen</p>
      <audio controls preload="metadata" aria-label="The Spectator Loop audio">
        <source src="assets/audio.mp3" type="audio/mpeg">
        <source src="assets/Audio%20Story.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
    </section>
  </main>
</body>
</html>
